name: eval-gate
on:
  pull_request:
  push: { branches: [live-gate] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  static:                          # cheap, no model: every skill and agent well formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vitest run static
  live:                            # the code-review skill of this PR against the one it replaces, live on DeepSeek
    runs-on: ubuntu-latest         # no recorded runs: the model answers now. About $0.01 and 1 minute per PR
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: base = the skill on the branch this PR goes into
        run: |
          BASE="origin/${{ github.base_ref || github.event.repository.default_branch }}"
          [ "${{ github.event_name }}" = pull_request ] || BASE=HEAD
          git show "$BASE:plugin/skills/code-review/SKILL.md" > "$RUNNER_TEMP/base-skill.md"
          echo "BASE_SKILL=$RUNNER_TEMP/base-skill.md" >> "$GITHUB_ENV"
          echo "base: $BASE"; git diff --stat "$BASE" -- plugin/skills/code-review/ || true
      - name: the matrix (no-skill, base, pr × every case × 3 runs)
        run: npx -y promptfoo@0.126.0 eval -c labs/live-review/promptfooconfig.yaml --repeat 3 -j 8 --no-cache -o live.json -o live.html || true
      - name: the gate (red when pr is worse than base)
        run: node labs/live-review/gate.mjs live.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: live-review-matrix, path: "live.*" }
