name: evals
on:
  pull_request:
  push: { branches: [gate-done, judge-start, judge-done] }
  workflow_dispatch:
permissions: { contents: read }
jobs:                              # only static so far: nothing here runs the evals
  static:                          # cheap, no model: every skill and agent well formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vitest run static
